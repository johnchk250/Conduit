plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.conduit.conduit"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.conduit.conduit"
        // minSdk 21+ for SAF document trees; 26+ for foreground service channels.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    def signingProperties = new Properties()
    def signingPropertiesFile = rootProject.file("key.properties")
    if (signingPropertiesFile.exists()) {
        signingPropertiesFile.withInputStream { signingProperties.load(it) }
    }
    def releaseStoreFile = System.getenv("CONDUIT_RELEASE_STORE_FILE") ?: signingProperties["storeFile"]
    def releaseStorePassword = System.getenv("CONDUIT_RELEASE_STORE_PASSWORD") ?: signingProperties["storePassword"]
    def releaseKeyAlias = System.getenv("CONDUIT_RELEASE_KEY_ALIAS") ?: signingProperties["keyAlias"]
    def releaseKeyPassword = System.getenv("CONDUIT_RELEASE_KEY_PASSWORD") ?: signingProperties["keyPassword"]
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
    def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            } else if (project.findProperty("conduit.allowDebugSigning") == "true") {
                // Explicitly opt-in for local smoke tests; never use debug keys
                // accidentally for a distributable APK.
                signingConfig = signingConfigs.debug
            } else if (releaseTaskRequested) {
                throw new GradleException(
                    "Release signing is not configured. Set CONDUIT_RELEASE_* " +
                    "environment variables or android/key.properties."
                )
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.2.2"

    // Storage Access Framework helpers (DocumentFile tree access)
    implementation "androidx.documentfile:documentfile:1.0.1"
    // Core KTX for NotificationCompat etc.
    implementation "androidx.core:core-ktx:1.13.1"
}
